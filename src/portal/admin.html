<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1115">
  <title>Library admin</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="portal.css">
  <style>
    .qrbox { background: #fff; padding: 8px; border-radius: 8px; display: inline-block; margin: 8px 0 }
    .qrbox svg { display: block; width: 168px; height: 168px }
    .stat { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px }
    .stat .card { margin: 0 } .stat b { font-size: 20px; display: block }
    .linkrow { display: flex; gap: 6px; align-items: center } .linkrow input { flex: 1; min-width: 0; font-size: 12px }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px } .acts .btn { padding: 6px 10px; font-size: 13px }
    .warn { border-color: var(--warn, #d9a441) }
    textarea.reply { width: 100%; min-height: 56px; margin-top: 6px }
  </style>
</head>
<body>
  <header class="top"><b id="brand">Library admin</b><span class="who" id="who"></span><button id="menu" title="Sign out" aria-label="Menu">⚙</button></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="empty">Loading…</div></main>
  <script src="qr.js"></script>
  <script src="admin.js"></script>
</body>
</html>
