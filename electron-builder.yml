appId: com.axialforge.medialedger
productName: MediaLedger
directories:
  output: dist
files:
  - src/**/*
  - package.json
publish:
  provider: github
  owner: AxialForge
  repo: medialedger
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: ${name}-${version}-setup.${ext}
  deleteAppDataOnUninstall: false
